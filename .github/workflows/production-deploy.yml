name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twenty-four-calculate-production
  cancel-in-progress: false

jobs:
  jenkins-acr-notice:
    name: Use Jenkins ACR deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://calc-api.pdurl.cn

    steps:
      - name: Explain production deployment path
        shell: bash
        run: |
          set -Eeuo pipefail
          cat <<'EOF'
          24-calculate production deployment is handled by the same ACR/Jenkins path
          used by the other image-based projects on this server.

          GitHub Actions remains responsible for CI and mirroring master to NAS.
          The old GHCR-based Production Deploy workflow is intentionally disabled
          because the production server now requires:

          - an immutable ACR image tag
          - CONFIG_SHA
          - managed production env payload

          See backend/deployments/PRODUCTION.md and
          backend/deployments/jenkins/24-calculate-backend.groovy.
          EOF
