name: Production Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: twenty-four-calculate-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/chenbb0128/24-calculate-backend

jobs:
  build:
    name: Build production image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      deploy_sha: ${{ steps.release.outputs.deploy_sha }}

    steps:
      - name: Select verified commit
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            deploy_sha="$WORKFLOW_RUN_SHA"
          else
            deploy_sha="$MANUAL_SHA"
          fi
          [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'deploy_sha=%s\n' "$deploy_sha" >> "$GITHUB_OUTPUT"

      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.deploy_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify backend tests
        working-directory: backend
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/deployments/Dockerfile.production
          platforms: linux/amd64
          push: true
          build-args: |
            GO_BUILD_PARALLELISM=2
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.deploy_sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=production-backend
          cache-to: type=gha,mode=max,scope=production-backend

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://calc-api.pdurl.cn

    steps:
      - name: Validate deployment context
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ needs.build.outputs.deploy_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_KNOWN_HOSTS"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure restricted SSH identity
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/twenty_four_calculate_deploy
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy selected image
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          DEPLOY_SHA: ${{ needs.build.outputs.deploy_sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n%s\n' "$GHCR_USER" "$GHCR_TOKEN" | ssh \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/twenty_four_calculate_deploy" \
            -p "${PROD_PORT:-22}" \
            "$PROD_USER@$PROD_HOST" \
            "$DEPLOY_SHA"

      - name: Verify public readiness endpoint
        run: >-
          curl --fail --show-error --silent
          --retry 5 --retry-all-errors --retry-delay 3
          https://calc-api.pdurl.cn/ready

      - name: Remove SSH identity
        if: always()
        run: rm -f ~/.ssh/twenty_four_calculate_deploy
