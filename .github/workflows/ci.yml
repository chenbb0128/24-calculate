name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Check native deployment scripts
        shell: bash
        run: bash -n scripts/*.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/wechat_game
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find src tools -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run offline smoke and audit checks
        shell: bash
        run: |
          node tools/smoke_test.js
          node tools/account_storage_audit.js
          node tools/auth_session_audit.js
          node tools/stability_audit.js
          node tools/module_audit.js
          node tools/button_audit.js
          node tools/layout_audit.js
          node tools/friend_match_audit.js
          node tools/matchmaking_audit.js
          node tools/question_quality_audit.js
          node tools/prelaunch_audit.js
