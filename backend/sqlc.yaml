version: "2"

sql:
  - engine: "mysql"
    schema: "database/migrations"
    queries: "database/queries"
    gen:
      go:
        package: "db"
        out: "internal/store/sqlc"
        sql_package: "database/sql"
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: false
