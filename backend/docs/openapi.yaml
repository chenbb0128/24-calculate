openapi: 3.0.3
info:
  title: Sanhuo Arithmetic Practice Backend API
  version: 2.2.0
  description: |
    Server-authoritative API for WeChat and TapTap authentication, runs, rooms, matchmaking, rewards, leaderboards, and administration.
    AppSecret and all provider credentials are server-only. Existing WeChat accounts ignore nickname/avatar fields on login; moderated profile synchronization is available through the authenticated user endpoint.
    Rejected, pending, and provider-unavailable moderation never overwrite the saved profile. Raw rejected profile data and provider access tokens are never returned.
servers:
  - url: /
tags:
  - name: system
  - name: auth
  - name: player
  - name: admin
    description: Administrative operations. User-management operations require a Bearer JWT whose role is admin; ordinary user JWTs are forbidden.
paths:
  /health:
    get:
      tags: [system]
      summary: Process health check
      responses:
        '200': {description: OK}
  /ready:
    get:
      tags: [system]
      summary: MySQL and Redis readiness check
      responses:
        '200': {description: Ready}
        '503': {$ref: '#/components/responses/Error'}
  /metrics:
    get:
      tags: [system]
      summary: Prometheus-compatible process and HTTP metrics
      description: Intended for private production monitoring and should not be exposed publicly without access control.
      responses:
        '200': {description: Prometheus text exposition}
  /api/v1/auth/wechat-login:
    post:
      tags: [auth]
      summary: Exchange a WeChat login code for tokens
      description: Nickname and avatar are optional because privacy authorization may be declined. The server keeps safe defaults for rejected, pending or unavailable profile moderation and never accepts an AppSecret from the client.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/WechatLoginInput'}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/taptap-login:
    post:
      tags: [auth]
      summary: Exchange a TapTap login code for tokens
      description: Accepts the temporary code returned by tap.login(). The server exchanges it with TapTap using server-side MiniApp credentials; the TapTap secret must never be sent by the client.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/TapTapLoginInput'}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RefreshInput'}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/users/me:
    get:
      tags: [auth]
      security: [{bearerAuth: []}]
      summary: Read the current profile
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Error'}}
    patch:
      tags: [auth]
      security: [{bearerAuth: []}]
      summary: Update profile after explicit user authorization
      description: Avatar may be changed only to a built-in preset or a backend-generated HTTPS avatar owned by the authenticated user. Nickname edits are currently disabled; the server returns NICKNAME_EDIT_DISABLED.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ProfileUpdateInput'}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/avatar:
    post:
      tags: [auth]
      security: [{bearerAuth: []}]
      summary: Upload and process a custom avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: JPG, PNG, or WEBP up to 2 MiB}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/users/me/wechat-profile/sync:
    post:
      tags: [auth]
      security: [{bearerAuth: []}]
      summary: Synchronize an authorized WeChat profile
      description: Exchanges a fresh wx.login code on the server, verifies that its openid belongs to the authenticated account, moderates nickname and avatar candidates, and only then publishes approved values. The WeChat avatar is downloaded and stored under the backend's own HTTPS avatar path; raw provider URLs are never returned.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/WechatProfileSyncInput'}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/player/bootstrap:
    get:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Load server-owned player state
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/player/rank:
    get:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Read the current server-authoritative ranked profile
      description: The season and all rank fields are selected by the server; client-local rank data is not trusted.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/player/campaign/runs:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Start a campaign run
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CampaignStartInput'}}
      responses:
        '201': {$ref: '#/components/responses/Success'}
  /api/v1/player/campaign/runs/{run_id}:
    get:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Resume a campaign run
      parameters: [{$ref: '#/components/parameters/RunID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '404': {$ref: '#/components/responses/Error'}, '410': {$ref: '#/components/responses/Error'}}
  /api/v1/player/campaign/runs/{run_id}/submit:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Submit a validated campaign run
      parameters: [{$ref: '#/components/parameters/RunID'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RunSubmission'}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/player/daily/runs:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Start or report the current daily challenge
      responses: {'201': {$ref: '#/components/responses/Success'}}
  /api/v1/player/daily/runs/{run_id}:
    get:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Resume a daily run
      parameters: [{$ref: '#/components/parameters/RunID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '404': {$ref: '#/components/responses/Error'}, '410': {$ref: '#/components/responses/Error'}}
  /api/v1/player/daily/runs/{run_id}/submit:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Submit a validated daily run
      parameters: [{$ref: '#/components/parameters/RunID'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RunSubmission'}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/player/endless/runs:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Start an endless run
      requestBody:
        required: false
        content:
          application/json: {schema: {$ref: '#/components/schemas/EndlessStartInput'}}
      responses: {'201': {$ref: '#/components/responses/Success'}}
  /api/v1/player/endless/runs/{run_id}:
    get:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Resume an endless run
      parameters: [{$ref: '#/components/parameters/RunID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '404': {$ref: '#/components/responses/Error'}, '410': {$ref: '#/components/responses/Error'}}
  /api/v1/player/endless/runs/{run_id}/next-question:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Validate the current endless answer and serve the next puzzle
      parameters: [{$ref: '#/components/parameters/RunID'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/EndlessNextQuestionInput'}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '410': {$ref: '#/components/responses/Error'}}
  /api/v1/player/endless/runs/{run_id}/submit:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Submit a validated endless run
      parameters: [{$ref: '#/components/parameters/RunID'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RunSubmission'}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/player/friend/history:
    get:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: List the authenticated player's friend-match history
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/player/friend/history/{match_id}:
    get:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Read one authenticated player's friend-match record
      parameters:
        - {name: match_id, in: path, required: true, schema: {type: string, maxLength: 128}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/player/friend/rooms:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Create a casual friend room
      description: Manual and invite-code rooms use the server-authoritative contract of 10 questions and 180 seconds. Client question-count and time-limit fields are ignored.
      requestBody:
        required: false
        content:
          application/json: {schema: {$ref: '#/components/schemas/FriendRoomCreateInput'}}
      responses: {'201': {$ref: '#/components/responses/Success'}}
  /api/v1/player/friend/rooms/{room_code}/join:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Join a friend room
      parameters: [{$ref: '#/components/parameters/RoomCode'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/player/friend/rooms/{room_code}:
    get:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Get a friend room
      parameters: [{$ref: '#/components/parameters/RoomCode'}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
    delete:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Leave a friend room
      parameters: [{$ref: '#/components/parameters/RoomCode'}]
      responses: {'204': {description: Left}}
  /api/v1/player/friend/rooms/{room_code}/ready:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Set friend room ready state
      parameters: [{$ref: '#/components/parameters/RoomCode'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ReadyInput'}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/player/friend/rooms/{room_code}/start:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Start a friend room countdown
      parameters: [{$ref: '#/components/parameters/RoomCode'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/player/friend/rooms/{room_code}/rematch:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Start a new isolated round in an existing friend room
      description: The room code and members are retained, while round_id, match_id, seed, puzzle contract, readiness, and progress are regenerated. The request is idempotent.
      parameters: [{$ref: '#/components/parameters/RoomCode'}]
      requestBody:
        required: false
        content:
          application/json: {schema: {$ref: '#/components/schemas/FriendRematchInput'}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/player/friend/rooms/{room_code}/match/progress:
    get:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Read server-owned friend match progress
      parameters: [{$ref: '#/components/parameters/RoomCode'}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Submit monotonic friend match progress
      parameters: [{$ref: '#/components/parameters/RoomCode'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/FriendProgressInput'}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/player/friend/rooms/{room_code}/match/submit:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Submit a validated friend match
      parameters: [{$ref: '#/components/parameters/RoomCode'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/FriendSubmission'}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/player/matchmaking/join:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Join quick matchmaking
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/MatchmakingJoinInput'}}
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/player/matchmaking/status:
    get:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Read matchmaking status
      parameters:
        - {name: ticket_id, in: query, required: true, schema: {type: string}}
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/player/matchmaking/cancel:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Cancel quick matchmaking
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/MatchmakingCancelInput'}}
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/player/leaderboards/{mode}:
    get:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Read a paginated leaderboard
      parameters:
        - {name: mode, in: path, required: true, schema: {type: string, enum: [campaign, daily, endless, friend, overall, ranked]}}
        - {name: scope, in: query, schema: {type: string, enum: [global, friends], default: global}}
        - {name: period, in: query, schema: {type: string, enum: [season, all, weekly, monthly], default: all, description: ranked defaults to season and is always scoped to the current server season}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/player/skins/{skin_id}/purchase:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Purchase a skin with server-owned coins
      parameters: [{name: skin_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/IdempotencyInput'}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/player/skins/{skin_id}/equip:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Equip an owned skin
      parameters: [{name: skin_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/player/cosmetics/{cosmetic_id}/purchase:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Purchase a cosmetic
      parameters: [{name: cosmetic_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/IdempotencyInput'}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/player/cosmetics/{cosmetic_id}/equip:
    post:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Equip an owned cosmetic
      parameters: [{name: cosmetic_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/player/preferences:
    patch:
      tags: [player]
      security: [{bearerAuth: []}]
      summary: Update bounded player preferences
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PreferencesInput'}}
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/admin/auth/login:
    post:
      tags: [admin]
      summary: Sign in to the administration API
      description: Administrator credentials are verified server-side. AppSecret and all provider credentials are server-only and are never accepted from this endpoint.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/AdminLoginInput'}}
      responses:
        '200': {$ref: '#/components/responses/AdminTokenResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/admin/auth/refresh:
    post:
      tags: [admin]
      summary: Rotate an administrator refresh token
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/AdminRefreshInput'}}
      responses:
        '200': {$ref: '#/components/responses/AdminTokenResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/admin/auth/logout:
    post:
      tags: [admin]
      summary: Revoke an administrator refresh token
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/AdminLogoutInput'}}
      responses:
        '200': {$ref: '#/components/responses/AdminLogoutResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: List users for administration
      description: Requires a Bearer JWT with role=admin. Nickname and avatar contain only the currently safe saved profile values; rejected raw profile data and provider access tokens are never returned.
      security: [{bearerAuth: []}]
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 128}, description: Username search text}
        - {name: status, in: query, schema: {type: string, enum: [all, active, disabled], default: all}}
        - {name: platform, in: query, schema: {type: string, enum: [all, wechat, taptap, password], default: all}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {$ref: '#/components/responses/AdminUserListResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/admin/users/{id}:
    get:
      tags: [admin]
      summary: Read an administratively safe user profile
      description: Requires a Bearer JWT with role=admin. Rejected, pending, or provider-unavailable moderation never overwrites the saved profile.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/AdminUserID'}]
      responses:
        '200': {$ref: '#/components/responses/AdminUserDetailResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/admin/users/{id}/disable:
    post:
      tags: [admin]
      summary: Disable a user account
      description: Requires a Bearer JWT with role=admin. This changes account status only and does not modify profile or moderation data.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/AdminUserID'}]
      responses:
        '200': {$ref: '#/components/responses/AdminUserStatusResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/admin/users/{id}/enable:
    post:
      tags: [admin]
      summary: Enable a user account
      description: Requires a Bearer JWT with role=admin. This changes account status only and does not modify profile or moderation data.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/AdminUserID'}]
      responses:
        '200': {$ref: '#/components/responses/AdminUserStatusResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    RunID: {name: run_id, in: path, required: true, schema: {type: string}}
    RoomCode: {name: room_code, in: path, required: true, schema: {type: string, pattern: '^[0-9]{6}$'}}
    AdminUserID: {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SuccessResponse'}
    Error:
      description: Error response with a legacy numeric or stable business code, request ID and null data
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AdminTokenResponse:
      description: Administrator token pair response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminTokenResponse'}
    AdminLogoutResponse:
      description: Administrator refresh token revoked
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminLogoutResponse'}
    AdminUserListResponse:
      description: Paginated administratively safe user list
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminUserListResponse'}
    AdminUserDetailResponse:
      description: Administratively safe user profile
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminUserDetailResponse'}
    AdminUserStatusResponse:
      description: Current account status after an idempotent status update
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminUserStatusResponse'}
  schemas:
    SuccessResponse:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, example: 0}
        message: {type: string, example: success}
        data: {nullable: true}
    ErrorResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          oneOf:
            - {type: integer, example: 10001}
            - {type: string, example: NICKNAME_EDIT_DISABLED}
          description: Legacy errors use numeric codes; moderation/business errors may use a stable string code.
        message: {type: string}
        request_id: {type: string}
        data: {nullable: true, example: null}
    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, format: password, writeOnly: true}
    AdminRefreshInput:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string, writeOnly: true}
    AdminLogoutInput:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string, writeOnly: true}
    AdminTokenData:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, minimum: 1}
    AdminLogoutData:
      type: object
      required: [revoked]
      properties:
        revoked: {type: boolean}
    AdminUserStats:
      type: object
      required: [total, new_today, active, disabled]
      properties:
        total: {type: integer, format: int64, minimum: 0}
        new_today: {type: integer, format: int64, minimum: 0}
        active: {type: integer, format: int64, minimum: 0}
        disabled: {type: integer, format: int64, minimum: 0}
    AdminUserListItem:
      type: object
      required: [id, username, nickname, avatar, platform, status, nickname_moderation_status, avatar_moderation_status, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        nickname: {type: string, description: Current safe public nickname only}
        avatar: {type: string, description: Current safe public avatar only}
        platform: {type: string, enum: [wechat, taptap, password]}
        status: {type: integer, enum: [0, 1], description: '0 is disabled; 1 is active'}
        nickname_moderation_status: {type: string, description: Current nickname moderation status}
        avatar_moderation_status: {type: string, description: Current avatar moderation status}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminSafeUserProfile:
      allOf:
        - {$ref: '#/components/schemas/AdminUserListItem'}
        - type: object
          properties:
            moderation_updated_at: {type: string, format: date-time, nullable: true}
      description: Contains only current safe saved nickname/avatar values and moderation states; no raw rejected profile input, moderation-provider payload, or provider access token is returned.
    AdminUserListData:
      type: object
      required: [items, page, page_size, total, stats]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminUserListItem'}}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0, description: Total matching the active filters}
        stats: {$ref: '#/components/schemas/AdminUserStats'}
    AdminUserDetailData:
      allOf:
        - {$ref: '#/components/schemas/AdminSafeUserProfile'}
    AdminUserStatusData:
      type: object
      required: [id, status, updated_at]
      properties:
        id: {type: integer, format: int64}
        status: {type: integer, enum: [0, 1]}
        updated_at: {type: string, format: date-time}
    AdminTokenResponse:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, example: 0}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/AdminTokenData'}
    AdminLogoutResponse:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, example: 0}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/AdminLogoutData'}
    AdminUserListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, example: 0}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/AdminUserListData'}
    AdminUserDetailResponse:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, example: 0}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/AdminUserDetailData'}
    AdminUserStatusResponse:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, example: 0}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/AdminUserStatusData'}
    WechatLoginInput:
      type: object
      required: [code]
      description: Nickname and avatar are compatibility fields only. Existing accounts never change profile data through login; use WechatProfileSyncInput after explicit privacy authorization.
      properties:
        code: {type: string, maxLength: 512}
        nickname: {type: string, maxLength: 12}
        avatar: {type: string, maxLength: 500}
    WechatProfileSyncInput:
      type: object
      required: [code]
      minProperties: 2
      properties:
        code: {type: string, maxLength: 512, description: Fresh wx.login code; it is single-use and verified against the current account}
        nickname: {type: string, maxLength: 12, description: WeChat-authorized nickname candidate; moderated before publication}
        avatar: {type: string, maxLength: 500, description: WeChat HTTPS qlogo.cn avatar URL or built-in preset; provider URLs are downloaded and moderated before storage}
    WechatProfileSyncData:
      type: object
      required: [user, sync_status, nickname_updated, avatar_updated]
      properties:
        user: {type: object, description: Safe current user profile; pending/rejected values are not returned}
        sync_status: {type: string, enum: [approved, pending, rejected, unavailable]}
        nickname_updated: {type: boolean}
        avatar_updated: {type: boolean}
    TapTapLoginInput:
      type: object
      required: [code]
      description: The code is returned by tap.login(). Nickname and avatar are optional local profile fields; TapTap does not provide WeChat profile authorization through this endpoint.
      properties:
        code: {type: string, maxLength: 512}
        nickname: {type: string, maxLength: 12}
        avatar: {type: string, maxLength: 500}
    ProfileUpdateInput:
      type: object
      minProperties: 1
      properties:
        nickname: {type: string, maxLength: 12, description: Empty resets to the default nickname}
        avatar: {type: string, maxLength: 500, description: Built-in avatar ID or an HTTPS URL previously generated by this backend for the authenticated user}
    FriendRoomCreateInput:
      type: object
      description: Ranked rooms cannot be created through this public endpoint. The server always uses 10 questions and 180 seconds for friend rooms.
      properties:
        question_count: {type: integer, description: Ignored for compatibility; server value is 10}
        time_limit_seconds: {type: integer, description: Ignored for compatibility; server value is 180}
    FriendRematchInput:
      type: object
      properties:
        idempotency_key: {type: string, minLength: 8, maxLength: 128}
        client_round_id: {type: string, maxLength: 128, description: Legacy client-compatible idempotency field}
    RefreshInput:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string}
    CampaignStartInput:
      type: object
      required: [level_id]
      properties:
        level_id: {type: integer, minimum: 0, maximum: 199}
    EndlessStartInput:
      type: object
      properties:
        protocol_version: {type: integer, enum: [1], default: 1}
        idempotency_key: {type: string, minLength: 8, maxLength: 128}
    EndlessNextQuestionInput:
      type: object
      required: [protocol_version, idempotency_key, question_index, puzzle_id, solved]
      properties:
        protocol_version: {type: integer, enum: [1]}
        idempotency_key: {type: string, minLength: 8, maxLength: 128}
        question_index: {type: integer, minimum: 0}
        puzzle_id: {type: string, maxLength: 64}
        elapsed_ms: {type: integer, minimum: 0, description: Client hint only; server time is authoritative}
        solved: {type: boolean}
        mistakes: {type: integer, minimum: 0, description: Client hint only}
        score_delta: {type: integer, minimum: 0, description: Client hint only}
        combo: {type: integer, minimum: 0, description: Client hint only}
        solution_steps: {type: array, items: {type: object}}
    RunSubmission:
      type: object
      required: [protocol_version, idempotency_key, run_id, attempts, summary]
      properties:
        protocol_version: {type: integer}
        idempotency_key: {type: string, minLength: 8, maxLength: 128}
        run_id: {type: string}
        attempts: {type: array, items: {type: object}}
        summary: {type: object}
        client_authoritative: {type: boolean, default: false}
    ReadyInput:
      type: object
      required: [ready]
      properties: {ready: {type: boolean}}
    FriendProgressInput:
      type: object
      required: [question_index, solved, score, elapsed_ms, match_id, question_hash, event_id]
      properties:
        question_index: {type: integer, minimum: 0}
        solved: {type: integer, minimum: 0}
        score: {type: integer, minimum: 0}
        elapsed_ms: {type: integer, minimum: 0}
        finished: {type: boolean}
        match_id: {type: string}
        question_hash: {type: string}
        event_id: {type: string}
    FriendSubmission:
      allOf:
        - {$ref: '#/components/schemas/RunSubmission'}
      description: The response may include a server-generated RankResult when the room is an eligible ranked matchmaking room.
    RankView:
      type: object
      required: [season_id, rating, tier, division, stars, placement_matches, ranked_matches, wins, losses, draws, best_tier]
      properties:
        season_id: {type: string, example: 2026-S3}
        rating: {type: integer, minimum: 0, maximum: 9999}
        tier: {type: string, enum: [bronze, silver, gold, platinum, diamond, master, king]}
        division: {type: integer, minimum: 1, maximum: 3}
        stars: {type: integer, minimum: 0, maximum: 4}
        placement_matches: {type: integer, minimum: 0, maximum: 5}
        ranked_matches: {type: integer, minimum: 0}
        wins: {type: integer, minimum: 0}
        losses: {type: integer, minimum: 0}
        draws: {type: integer, minimum: 0}
        best_tier: {type: string}
        updated_at: {type: string, format: date-time}
    RankResult:
      type: object
      required: [eligible]
      properties:
        eligible: {type: boolean}
        reason: {type: string, enum: [casual_match, bot_match]}
        season_id: {type: string}
        match_id: {type: string}
        outcome: {type: string, enum: [win, lose, draw]}
        rating: {type: integer, minimum: 0, maximum: 9999}
        rating_before: {type: integer, minimum: 0, maximum: 9999}
        rating_delta: {type: integer}
        rating_after: {type: integer, minimum: 0, maximum: 9999}
        tier: {type: string}
        tier_before: {type: string}
        tier_after: {type: string}
        division: {type: integer, minimum: 1, maximum: 3}
        division_before: {type: integer, minimum: 1, maximum: 3}
        division_after: {type: integer, minimum: 1, maximum: 3}
        stars: {type: integer, minimum: 0, maximum: 4}
        stars_before: {type: integer, minimum: 0, maximum: 4}
        stars_after: {type: integer, minimum: 0, maximum: 4}
        placement_matches: {type: integer, minimum: 0, maximum: 5}
        ranked_matches: {type: integer, minimum: 0}
        wins: {type: integer, minimum: 0}
        losses: {type: integer, minimum: 0}
        draws: {type: integer, minimum: 0}
    MatchmakingJoinInput:
      type: object
      required: [mode, rules_version, client_ticket]
      properties:
        mode: {type: string, enum: [friend]}
        rules_version: {type: integer, example: 1}
        client_ticket: {type: string, minLength: 8, maxLength: 128}
        region: {type: string, maxLength: 32}
        ranked: {type: boolean, default: false, description: Selects the ranked queue; rank snapshot fields below are compatibility-only.}
        season_id: {type: string, description: Ignored by the server; current season is selected from configuration/time.}
        rank_tier: {type: string, description: Compatibility-only client snapshot.}
        rank_division: {type: integer, minimum: 1, maximum: 3, description: Compatibility-only client snapshot.}
        rank_stars: {type: integer, minimum: 0, maximum: 4, description: Compatibility-only client snapshot.}
    MatchmakingCancelInput:
      type: object
      required: [ticket_id]
      properties: {ticket_id: {type: string}}
    IdempotencyInput:
      type: object
      properties:
        idempotency_key: {type: string, minLength: 8, maxLength: 128}
    PreferencesInput:
      type: object
      properties:
        music_enabled: {type: boolean}
        sfx_enabled: {type: boolean}
        music_track: {type: integer, minimum: 0, maximum: 2}
        music_volume: {type: number, minimum: 0, maximum: 1}
        sfx_volume: {type: number, minimum: 0, maximum: 1}
